<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII.RENDER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

        /* Общие CSS переменные */
        :root {
            /* Базовые цвета неонового свечения */
            --neon-blue: #00f3ff;
            --neon-green: #39ff14;
            --neon-red: #ff003c;
            --neon-crimson: #ff2a2a;
            --neon-cyber: #00ffff;
            
            --bg-dark: #050508;
            --panel-bg: rgba(10, 15, 20, 0.75);
            --border-glow: 0 0 10px;
        }

        /* Цветовые схемы экрана */
        body[data-theme="white"] { --text: #e0e0e0; --glow-color: rgba(224, 224, 224, 0.5); }
        body[data-theme="green"] { --text: var(--neon-green); --glow-color: rgba(57, 255, 20, 0.5); }
        body[data-theme="crimson"] { --text: var(--neon-crimson); --glow-color: rgba(255, 42, 42, 0.5); }
        body[data-theme="cyber"] { --text: var(--neon-cyber); --glow-color: rgba(0, 255, 255, 0.8); }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            font-family: 'Share Tech Mono', monospace;
            color: var(--text);
            user-select: none;
            overflow: hidden;
            position: relative;
        }

        /* Matrix Background */
        #matrixCanvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            opacity: 0.3;
        }

        /* CRT Effects Layer (Scanlines, Vignette, Flicker) */
        .crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999;
            pointer-events: none;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            50% { opacity: 1; }
            100% { opacity: 0.98; }
        }

        /* Главный контейнер плеера */
        .player-app {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            width: 95%;
            height: 95%;
            max-width: 1400px;
            background: var(--panel-bg);
            border: 2px solid var(--neon-blue);
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.2), 0 0 30px rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            padding: 15px;
            gap: 15px;
            backdrop-filter: blur(10px);
        }

        .player-app:fullscreen {
            width: 100%;
            height: 100%;
            max-width: none;
            border: none;
            border-radius: 0;
            padding: 20px;
            background: rgba(5, 5, 8, 0.95);
        }

        /* Заголовок */
        .title-bar {
            text-align: center;
            font-family: 'VT323', monospace;
            font-size: 3rem;
            letter-spacing: 5px;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
            border-bottom: 2px dashed var(--neon-blue);
            padding-bottom: 10px;
        }

        /* Экран плеера / Зона Drag & Drop */
        .screen-container {
            position: relative;
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--neon-green);
            box-shadow: inset 0 0 30px rgba(57, 255, 20, 0.1), 0 0 15px rgba(57, 255, 20, 0.2);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .screen-container.dragover {
            background: rgba(57, 255, 20, 0.1);
            border-style: dashed;
            box-shadow: inset 0 0 50px rgba(57, 255, 20, 0.3), 0 0 25px rgba(57, 255, 20, 0.5);
        }

        /* Контент Drop Zone */
        .drop-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
        }

        .drop-icon {
            width: 80px;
            height: 80px;
            fill: none;
            stroke: var(--neon-green);
            stroke-width: 2;
            filter: drop-shadow(0 0 10px var(--neon-green));
            animation: pulse-icon 2s infinite;
        }

        @keyframes pulse-icon {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .drop-text {
            font-family: 'VT323', monospace;
            font-size: 2.5rem;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            letter-spacing: 2px;
        }

        /* Кнопка Demo */
        .demo-btn {
            background: transparent;
            border: 2px solid var(--neon-red);
            color: var(--neon-red);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            text-shadow: 0 0 8px var(--neon-red);
            box-shadow: 0 0 10px rgba(255, 0, 60, 0.2), inset 0 0 10px rgba(255, 0, 60, 0.2);
            z-index: 15;
        }

        .demo-btn:hover {
            background: rgba(255, 0, 60, 0.15);
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.6), inset 0 0 20px rgba(255, 0, 60, 0.4);
        }

        .demo-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--neon-red);
            filter: drop-shadow(0 0 5px var(--neon-red));
        }

        /* ASCII Display */
        #asciiDisplay {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            white-space: pre;
            line-height: 1;
            text-align: center;
            color: var(--text);
            text-shadow: 0 0 5px var(--glow-color);
            font-weight: bold;
        }

        /* Панель управления (Сегментированные кнопки) */
        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 4px;
            padding: 10px 15px;
        }

        /* Hover Settings Menu */
        .settings-hover-container {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .settings-header {
            color: var(--neon-blue);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px var(--neon-blue);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 5px 0;
            border-bottom: 1px dashed transparent;
            transition: border-color 0.3s;
        }

        .settings-hover-container:hover .settings-header {
            border-color: rgba(0, 243, 255, 0.3);
        }

        .settings-header svg {
            width: 18px;
            height: 18px;
            fill: var(--neon-blue);
            filter: drop-shadow(0 0 5px var(--neon-blue));
            transition: transform 0.3s;
        }

        .settings-hover-container:hover .settings-header svg {
            transform: rotate(90deg);
        }

        .settings-content {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.4s ease, padding 0.4s ease;
        }

        .settings-hover-container:hover .settings-content {
            max-height: 500px;
            opacity: 1;
            padding-top: 15px;
            padding-bottom: 5px;
            border-bottom: 1px dashed rgba(0, 243, 255, 0.3);
        }

        .control-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .control-label {
            color: var(--neon-blue);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 5px var(--neon-blue);
        }

        /* Segmented Radio Buttons */
        .segmented-control {
            display: flex;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--neon-blue);
            border-radius: 4px;
            overflow: hidden;
        }

        .segmented-control input[type="radio"] {
            display: none;
        }

        .segmented-control label {
            flex: 1;
            text-align: center;
            padding: 8px 6px;
            cursor: pointer;
            color: #666;
            font-size: 0.85rem;
            transition: all 0.2s;
            border-right: 1px solid rgba(0, 243, 255, 0.3);
        }
        .segmented-control label:last-child {
            border-right: none;
        }

        .segmented-control input[type="radio"]:checked + label {
            background: rgba(0, 243, 255, 0.2);
            color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
            box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.5);
        }

        /* Специфично для темы CYBERPUNK - ярче */
        #theme-cyber:checked + label {
            background: rgba(0, 255, 255, 0.3);
            color: var(--neon-cyber);
            text-shadow: 0 0 15px var(--neon-cyber);
            box-shadow: inset 0 0 15px rgba(0, 255, 255, 0.8);
        }

        /* Ползунок Volume / Resolution */
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type="range"]:focus {
            outline: none;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(0, 243, 255, 0.2);
            border-radius: 3px;
            border: 1px solid var(--neon-blue);
        }
        input[type="range"]::-webkit-slider-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--neon-blue);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -6px;
            box-shadow: 0 0 10px var(--neon-blue);
        }

        /* Media Panel */
        .media-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding-top: 5px;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.2);
        }

        .icon-btn:hover {
            background: rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            filter: drop-shadow(0 0 5px currentColor);
        }

        .volume-icon {
            color: var(--neon-blue);
            width: 24px;
            height: 24px;
        }

        /* Скрытые элементы */
        #fileInput, #customVideo, #offscreenCanvas { display: none; }
    </style>
</head>

    <script>
        // --- Matrix Background Animation ---
        const mCanvas = document.getElementById('matrixCanvas');
        const mCtx = mCanvas.getContext('2d');
        
        mCanvas.width = window.innerWidth;
        mCanvas.height = window.innerHeight;
        
        const matrixChars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        const fontSize = 16;
        let columns = mCanvas.width / fontSize;
        let drops = [];
        for(let x = 0; x < columns; x++) drops[x] = 1;
        
        function drawMatrix() {
            // Pause matrix animation to save CPU when video is covering the screen
            if (dropContent.style.display === 'none') return;
            
            mCtx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            mCtx.fillRect(0, 0, mCanvas.width, mCanvas.height);
            mCtx.fillStyle = '#0F0';
            mCtx.font = fontSize + 'px monospace';
            
            for(let i = 0; i < drops.length; i++) {
                const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
                mCtx.fillText(text, i * fontSize, drops[i] * fontSize);
                if(drops[i] * fontSize > mCanvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        window.addEventListener('resize', () => {
            mCanvas.width = window.innerWidth;
            mCanvas.height = window.innerHeight;
            columns = mCanvas.width / fontSize;
            drops = [];
            for(let x = 0; x < columns; x++) drops[x] = 1;
        });

        // --- Core App Logic ---
        const dropZone = document.getElementById('dropZone');
        const dropContent = document.getElementById('dropContent');
        const fileInput = document.getElementById('fileInput');
        const demoBtn = document.getElementById('demoBtn');
        
        const asciiDisplay = document.getElementById('asciiDisplay');
        const customVideo = document.getElementById('customVideo');
        const canvas = document.getElementById('offscreenCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        // Media Panel buttons
        const playPauseBtn = document.getElementById('playPauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');

        let isPlaying = false;
        
        const palettes = {
            ascii: ' .\'`^",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$',
            braille: ' ⠁⠃⠇⡇⣇⣧⣷⣿',
            binary: ' 01',
            blocks: '  ░▒▓█'
        };
        
        let currentPalette = palettes.ascii;

        // --- Control Handlers ---

        document.querySelectorAll('input[name="theme"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                document.body.setAttribute('data-theme', e.target.value);
            });
        });

        document.querySelectorAll('input[name="mode"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                currentPalette = palettes[e.target.value];
                if (!isPlaying && customVideo.videoWidth) renderSingleFrame();
            });
        });

        document.querySelectorAll('input[name="density"]').forEach(radio => {
            radio.addEventListener('change', () => {
                if (customVideo.videoWidth) {
                    updateResolution();
                    if (!isPlaying) renderSingleFrame();
                }
            });
        });

        // --- Media Control Handlers ---

        function togglePlayPause() {
            if (customVideo.readyState === 0) return;
            if (isPlaying) {
                customVideo.pause();
                isPlaying = false;
                iconPlay.style.display = 'block';
                iconPause.style.display = 'none';
            } else {
                customVideo.play().catch(e => console.warn(e));
                isPlaying = true;
                iconPlay.style.display = 'none';
                iconPause.style.display = 'block';
                requestAnimationFrame(renderLoop);
            }
        }

        playPauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            togglePlayPause();
        });

        restartBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (customVideo.readyState > 0) {
                customVideo.currentTime = 0;
                if (!isPlaying) togglePlayPause();
            }
        });

        const fullscreenBtn = document.getElementById('fullscreenBtn');
        fullscreenBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const videoArea = document.getElementById('dropZone');
            if (!document.fullscreenElement) {
                videoArea.requestFullscreen().catch(err => {
                    console.warn(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            customVideo.volume = e.target.value;
        });

        customVideo.volume = volumeSlider.value;

        // --- Drag & Drop & Load ---

        dropZone.addEventListener('click', (e) => {
            // Только ставим на паузу, если видео загружено
            if (customVideo.readyState > 0 && !e.target.closest('.demo-btn')) {
                togglePlayPause();
            }
        });

        const uploadBtn = document.getElementById('uploadBtn');
        const mediaUploadBtn = document.getElementById('mediaUploadBtn');
        const triggerUpload = (e) => {
            e.stopPropagation();
            fileInput.click();
        };
        uploadBtn.addEventListener('click', triggerUpload);
        if (mediaUploadBtn) mediaUploadBtn.addEventListener('click', triggerUpload);

        demoBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            // Load Demo Bad Apple video (using a common direct link if local is not present)
            // A local link might fail, so we use an archive.org link
            const demoUrl = "https://ia801908.us.archive.org/17/items/BadApple_201612/Bad%20Apple.mp4";
            loadVideoSrc(demoUrl);
        });

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            document.body.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            if (dt.files && dt.files.length > 0) handleFile(dt.files[0]);
        }, false);

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file) return;
            const fileURL = URL.createObjectURL(file);
            loadVideoSrc(fileURL);
        }

        function loadVideoSrc(src) {
            customVideo.crossOrigin = "anonymous"; // For external demo URL
            customVideo.src = src;
            dropContent.style.display = 'none';
            asciiDisplay.style.display = 'block';

            customVideo.addEventListener('loadedmetadata', () => {
                updateResolution();
                window.addEventListener('resize', adjustSizeFromVideo);
                
                customVideo.play().then(() => {
                    isPlaying = true;
                    iconPlay.style.display = 'none';
                    iconPause.style.display = 'block';
                    requestAnimationFrame(renderLoop);
                }).catch(e => {
                    console.warn("Autoplay prevented or error:", e);
                    isPlaying = false;
                    iconPlay.style.display = 'block';
                    iconPause.style.display = 'none';
                    renderSingleFrame();
                });
            }, { once: true });
        }

        // --- ASCI Render Logic ---

        function updateResolution() {
            if (!customVideo.videoWidth) return;
            const videoRatio = customVideo.videoWidth / customVideo.videoHeight;
            const charAspect = 0.5; 
            
            const checkedDensity = document.querySelector('input[name="density"]:checked').value;
            const density = parseInt(checkedDensity, 10);
            
            canvas.width = density;
            canvas.height = Math.floor((canvas.width * charAspect) / videoRatio);
            
            adjustSizeFromVideo();
        }

        function adjustSizeFromVideo() {
            if (!canvas.width) return;
            const charAspect = 0.5;
            const winW = dropZone.clientWidth * 0.98;
            const winH = dropZone.clientHeight * 0.98;

            const fontSizeW = winW / (canvas.width * charAspect);
            const fontSizeH = winH / canvas.height;

            let asciiFontSize = Math.floor(Math.min(fontSizeW, fontSizeH));
            asciiFontSize = Math.max(4, asciiFontSize);

            asciiDisplay.style.fontSize = asciiFontSize + 'px';
            asciiDisplay.style.lineHeight = asciiFontSize + 'px';
        }

        function videoToAscii() {
            ctx.drawImage(customVideo, 0, 0, canvas.width, canvas.height);
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            
            let asciiStr = '';
            const palLen = currentPalette.length - 1;
            
            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const offset = (y * canvas.width + x) * 4;
                    const brightness = (0.299 * data[offset] + 0.587 * data[offset + 1] + 0.114 * data[offset + 2]);
                    const charIndex = Math.floor((brightness / 255) * palLen);
                    
                    asciiStr += currentPalette[palLen - charIndex];
                }
                asciiStr += '\n';
            }
            return asciiStr;
        }

        let lastRenderTime = 0;
        const TARGET_FPS = 30;
        const RENDER_INTERVAL = 1000 / TARGET_FPS;

        function renderLoop(timestamp) {
            if (!isPlaying) return;

            if (customVideo.ended) {
                isPlaying = false;
                iconPlay.style.display = 'block';
                iconPause.style.display = 'none';
            } else {
                if (!lastRenderTime || timestamp - lastRenderTime >= RENDER_INTERVAL) {
                    asciiDisplay.textContent = videoToAscii();
                    lastRenderTime = timestamp;
                }
            }

            if (isPlaying) requestAnimationFrame(renderLoop);
        }

        function renderSingleFrame() {
            if (customVideo.readyState > 0) {
                asciiDisplay.textContent = videoToAscii();
            }
        }
    </script>
</body>
</html>
